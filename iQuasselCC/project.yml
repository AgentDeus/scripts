# Optional: regenerate the Xcode project with XcodeGen (`xcodegen generate`).
# The committed iQuasselCC.xcodeproj is produced by tools/generate_xcodeproj.py and is equivalent.
name: iQuasselCC
options:
  bundleIdPrefix: app.iquasselcc
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  iQuasselCC:
    type: application
    platform: iOS
    sources:
      - path: iQuasselCC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.iquasselcc.client
        INFOPLIST_FILE: iQuasselCC/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
  iQuasselCCTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: iQuasselCCTests
      - path: iQuasselCC/Protocol
      - path: iQuasselCC/Model/Network.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.iquasselcc.client.tests
schemes:
  iQuasselCC:
    build:
      targets:
        iQuasselCC: all
    test:
      targets:
        - iQuasselCCTests
